name: Site checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを準備
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 静的ページを生成
        run: node scripts/build.js

      - name: データと生成物を検査
        run: node scripts/check.js

      - name: 生成物の差分を検査
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
