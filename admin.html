<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>管理画面 | Fukuoka Chill Map</title>
    <link rel="icon" href="images/Fukuoka-monuments.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-container">
        <a href="index.html" class="header-logo-link">
            <img src="images/Fukuoka-monuments.jpg" alt="福岡ランドマーク" class="header-monument-img">
        </a>
        <div class="header-title-group">
            <h1>🛠 管理画面</h1>
        </div>
        <button class="hamburger" id="hamburger-btn" aria-label="メニューを開く">
            <span></span><span></span><span></span>
        </button>
    </div>

    <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link"><i data-lucide="home"></i> トップに戻る</a>
        <a href="list.html?category=cafe" class="nav-link"><i data-lucide="coffee"></i> カフェ</a>
        <a href="list.html?category=sauna" class="nav-link"><i data-lucide="flame"></i> サウナ</a>
        <a href="list.html?category=running" class="nav-link"><i data-lucide="footprints"></i> ランニング</a>
        <a href="favorites.html" class="nav-link"><i data-lucide="heart"></i> お気に入り</a>
        <a href="request.html" class="nav-link"><i data-lucide="clipboard-list"></i> スポット追加依頼</a>
        <a href="admin.html" class="nav-link admin-only"><i data-lucide="shield"></i> 管理者ページ</a>
    </nav>
</header>

<!-- ロック画面：正しいパスワードを入れるまでダッシュボードは見えない -->
<div id="admin-gate" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon">🔒</div>
        <h3>管理者認証</h3>
        <p>パスワードを入力してください。</p>
        <div class="form-group">
            <input type="password" id="gate-password" placeholder="パスワード">
        </div>
        <p id="gate-error" style="color: var(--color-rose); font-size: 13px; display:none;">パスワードが違います。</p>
        <button type="button" class="modal-btn" id="gate-submit">入る</button>
    </div>
</div>

<div id="admin-dashboard" class="container" style="max-width: 900px; margin: 30px auto; padding: 0 20px; display:none;">
    <div class="filter-container">
        <label><input type="radio" name="status" value="pending" checked> 承認待ち</label>
        <label><input type="radio" name="status" value="approved"> 承認済み</label>
        <label><input type="radio" name="status" value="rejected"> 却下済み</label>
    </div>

    <div id="submission-list"></div>
</div>

<footer>
    <p id="copyright">© 2026 Fukuoka Chill Map</p>
    <img src="images/fukuoka-monuments-black.jpg" alt="福岡ランドマーク" class="footer-monument-img">
</footer>

<script>
(function () {
    // utils.js の管理者パスワードと必ず同じ値にすること
    var ADMIN_PASSWORD_FOR_GATE = "20000420";
    var token = sessionStorage.getItem("adminToken");
    var gate = document.getElementById("admin-gate");
    var dashboard = document.getElementById("admin-dashboard");

    if (token === ADMIN_PASSWORD_FOR_GATE) {
        dashboard.style.display = "block";
    } else {
        gate.classList.add("active");
    }
})();
</script>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/utils.js"></script>
<script src="js/categories.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
