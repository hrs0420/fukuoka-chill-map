<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スポット追加依頼 | Fukuoka Chill Map</title>
    <link rel="icon" href="images/Fukuoka-monuments.jpg" type="image/jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="header-container">
        <a href="index.html" class="header-logo-link">
            <img src="images/Fukuoka-monuments.jpg" alt="福岡ランドマーク" class="header-monument-img">
        </a>
        <div class="header-title-group">
            <h1>📝 スポット追加依頼</h1>
        </div>
        <button class="hamburger" id="hamburger-btn" aria-label="メニューを開く">
            <span></span><span></span><span></span>
        </button>
    </div>
    <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">トップに戻る</a>
        <a href="list.html?category=cafe" class="nav-link">☕ カフェ</a>
        <a href="list.html?category=sauna" class="nav-link">🧖 サウナ</a>
        <a href="list.html?category=running" class="nav-link">🏃 ランニング</a>
        <a href="favorites.html" class="nav-link">❤️ お気に入り</a>
        <a href="admin.html" class="nav-link admin-only">🛠 管理者ページ</a>
    </nav>
</header>

<div class="detail">
    <p style="text-align: center; color: #6b6b63;">
        あなたの知っている福岡のChillスポットを教えてください。<br>
        管理者が内容確認後、サイトに掲載されます。
    </p>

    <form id="request-form" class="comment-form">
        <div class="form-group">
            <label for="category">カテゴリ</label>
            <select id="category" required>
                <option value="cafe">☕ カフェ</option>
                <option value="sauna">🧖 サウナ</option>
                <option value="running">🏃 ランニング</option>
            </select>
        </div>

        <div class="form-group">
            <label for="name">スポット名 *</label>
            <input type="text" id="name" required>
        </div>

        <div class="form-group">
            <label for="area">エリア *</label>
            <input type="text" id="area" required placeholder="例: 大濠、天神">
        </div>

        <div class="form-group">
            <label for="description">紹介文 *</label>
            <textarea id="description" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label for="image">スポットの画像</label>
            <input type="file" id="image" accept="image/png, image/jpeg, image/webp">
            <img id="image-preview" style="display:none; margin-top:10px; max-width:100%; height:180px; object-fit:cover; border-radius:8px;">
        </div>

        <div class="form-group">
            <label for="address">住所</label>
            <input type="text" id="address">
        </div>

        <div class="form-group">
            <label for="map">Googleマップリンク</label>
            <input type="url" id="map" placeholder="https://maps.app.goo.gl/...">
        </div>

        <div id="category-fields"></div>

        <hr>

        <div class="form-group">
            <label for="submitter-name">あなたのお名前（任意）</label>
            <input type="text" id="submitter-name" placeholder="匿名">
        </div>

        <div class="form-group">
            <label for="submitter-note">管理者へのメモ（任意）</label>
            <textarea id="submitter-note" rows="2" placeholder="補足情報があれば"></textarea>
        </div>


        <button type="button" id="open-confirm-btn" class="submit-btn">依頼を送信する</button>
    </form>

    <p id="form-status" style="text-align:center; margin-top:15px; color: var(--color-rose);"></p>
</div>

<div id="confirm-submit-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon">📮</div>
        <h3>この内容で送信しますか？</h3>
        <p>送信後、管理者の承認を待つ状態になります。</p>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap: wrap;">
            <button type="button" class="modal-btn" id="cancel-confirm-btn" style="background:#999;">キャンセル</button>
            <button type="button" class="modal-btn" id="proceed-submit-btn">送信する</button>
        </div>
    </div>
</div>

<div id="submit-success-modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon">🎉</div>
        <h3>依頼を送信しました！</h3>
        <p>管理者の確認後、サイトに掲載されます。</p>
        <div style="display:flex; gap:10px; justify-content:center; flex-wrap: wrap; margin-top: 10px;">
            <a href="index.html" class="modal-btn">🏠 ホームへ戻る</a>
            <button type="button" class="modal-btn" id="continue-btn" style="background:var(--color-accent);">📝 続けて入力する</button>
        </div>
    </div>
</div>
</div>

<footer>
    <p>© 2026 Fukuoka Chill Map</p>
</footer>

<script src="js/utils.js"></script>
<script src="js/categories.js"></script>
<script src="js/request.js"></script>
</body>
</html>
