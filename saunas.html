<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サウナ | Fukuoka Chill Map</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>♨ サウナ一覧</h1>
</header>
<div class="search-container">
    <input 
        type="text"
        id="search"
        placeholder="サウナ名で検索...">
</div>

<div class="filter-container">

    <label>
        <input type="checkbox" id="onsen">
        温浴あり
    </label>

    <label>
        <input type="checkbox" id="loyly">
        ロウリュあり
    </label>

    <label>
        <input type="checkbox" id="stay">
        宿泊可能
    </label>

    <label>
        <input type="checkbox" id="parking">
        駐車場あり
    </label>

    <label>
        エリア
        <select id="area">
            <option value="">すべてのエリア</option>
            <option value="中州">中州</option>
            <option value="天神">天神</option>
            <option value="筑紫野">筑紫野</option>
        </select>
    </label>
</div>

<div id="sauna-list" class="card-grid"></div>

<p style="text-align: center;">
    <a href="index.html">← トップへ戻る</a>
</p>

<script src="js/utils.js"></script>
<script src="js/sauna.js"></script>

</body>

</html>
