<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サウナ | Fukuoka Chill Map</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="header-container">
        <a href="index.html">
            <img src="images/fukuoka-monuments.jpg" alt="福岡ランドマーク" class="header-monument-img">
        </a>
        <h1>♨ サウナ一覧</h1>
        <button class="hamburger" id="hamburger-btn" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <nav class="nav-menu" id="nav-menu">
        <a href="index.html" class="nav-link">トップに戻る</a>
        <a href="cafes.html" class="nav-link">☕ カフェ</a>
        <a href="saunas.html" class="nav-link">🧖 サウナ</a>
        <a href="running.html" class="nav-link">🏃 ランニング</a>
        <a href="favorites.html" class="nav-link">❤️ お気に入り</a>
    </nav>
</header>
<div class="search-container">
    <input 
        type="text"
        id="search"
        placeholder="サウナ名で検索...">
</div>

<div class="filter-container">

    <label>
        <input type="checkbox" id="onsen">
        温浴あり
    </label>

    <label>
        <input type="checkbox" id="loyly">
        ロウリュあり
    </label>

    <label>
        <input type="checkbox" id="stay">
        宿泊可能
    </label>

    <label>
        <input type="checkbox" id="parking">
        駐車場あり
    </label>

    <label>
        エリア
        <select id="area">
            <option value="">すべてのエリア</option>
            <option value="中州">中州</option>
            <option value="天神">天神</option>
            <option value="筑紫野">筑紫野</option>
            <option value="小戸">小戸</option>
            <option value="糸島">糸島</option>
            <option value="久留米">久留米</option>
            <option value="照葉">照葉</option>
            <option value="糟屋郡">糟屋郡</option>
        </select>
    </label>
</div>

<div id="sauna-list" class="card-grid"></div>

<p style="text-align: center;">
    <a href="index.html">← トップへ戻る</a>
</p>

<script src="js/utils.js"></script>
<script src="js/sauna.js"></script>

<footer>

<p>© 2026 Fukuoka Chill Map</p>
    <img src="images/fukuoka-monuments-black.jpg" alt="福岡ランドマーク" class="footer-monument-img">
</footer>

</body>

</html>
